name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: alibi receipts its own test run and the gate passes on a clean tree
        run: |
          node skills/alibi/scripts/alibi.js run -- npm test
          node skills/alibi/scripts/alibi.js check
